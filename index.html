<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Studio: скрипты курса</title>
  <meta name="description" content="Готовые скрипты для уроков Roblox Studio для детей 9–12 лет. Удобное копирование в один клик и режим проектора.">

  <!-- Шрифт Montserrat от Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       БАЗОВЫЕ ПЕРЕМЕННЫЕ И СБРОС СТИЛЕЙ
       Основной цвет: #833AE0 (фиолетовый)
       Цвет текста: #222222
       ========================================================================== */
    :root {
      --primary: #833AE0;
      --primary-hover: #6f2dc4;
      --primary-light: #f3ebfc;
      --primary-glow: rgba(131, 58, 224, 0.25);
      --success: #10b981;
      --success-hover: #059669;
      --text: #222222;
      --text-muted: #555555;
      --bg: #f8f9fd;
      --card-bg: #ffffff;
      --border: #e6e8f0;
      --code-bg: #1e1e2e;
      --code-text: #cdd6f4;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 30px rgba(131, 58, 224, 0.12);
      --radius: 12px;
      --font-main: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-code: 'Fira Code', Consolas, Monaco, 'Courier New', monospace;

      /* Размеры шрифтов по умолчанию */
      --fs-base: 16px;
      --fs-title: 22px;
      --fs-header: 28px;
      --fs-code: 16px;
      --fs-btn: 16px;
      --fs-badge: 14px;
      --space-card: 24px;
    }

    /* РЕЖИМ ПРОЕКТОРА (увеличивает размеры в 1.5 раза для видимости с задних парт) */
    html.projector-mode {
      --fs-base: 24px;
      --fs-title: 32px;
      --fs-header: 38px;
      --fs-code: 22px;
      --fs-btn: 22px;
      --fs-badge: 18px;
      --space-card: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: font-size 0.2s ease;
      font-size: var(--fs-base);
    }

    /* ==========================================================================
       ШАПКА САЙТА (HEADER)
       ========================================================================== */
    header {
      background: #ffffff;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 24px;
      box-shadow: 0 4px 12px var(--primary-glow);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: var(--fs-header);
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .brand-text .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      display: block;
    }

    /* ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМА ПРОЕКТОРА */
    .projector-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--primary-light);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 10px 18px;
      border-radius: 50px;
      font-family: var(--font-main);
      font-size: var(--fs-btn);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      outline: none;
    }

    .projector-toggle-btn:hover {
      background: var(--primary);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .projector-toggle-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 0 3px rgba(131, 58, 224, 0.35);
    }

    .projector-toggle-btn .toggle-icon {
      font-size: 1.2em;
      line-height: 1;
    }

    /* ==========================================================================
       ОСНОВНОЙ МАКЕТ: СЛЕВА УРОКИ, СПРАВА КАРТОЧКИ
       ========================================================================== */
    .main-container {
      max-width: 1300px;
      width: 100%;
      margin: 24px auto 40px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 28px;
      align-items: start;
      flex: 1;
    }

    /* САЙДБАР С УРОКАМИ */
    .sidebar {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 96px;
      border: 1px solid var(--border);
    }

    .sidebar-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      padding: 8px 12px 14px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lessons-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lesson-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-main);
      font-size: var(--fs-base);
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .lesson-btn:hover {
      background: #f4f5f9;
      color: var(--primary);
    }

    .lesson-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .lesson-count {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.07);
      color: inherit;
      font-weight: 700;
    }

    .lesson-btn.active .lesson-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* СЕКЦИЯ КОНТЕНТА СО СКРИПТАМИ */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0; /* предотвращает переполнение pre */
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 4px;
    }

    .current-lesson-title {
      font-size: var(--fs-title);
      font-weight: 800;
      color: var(--text);
    }

    .scripts-counter {
      color: var(--text-muted);
      font-weight: 600;
      font-size: var(--fs-badge);
      background: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* ПОИСКОВАЯ СТРОКА ДЛЯ ДЕТЕЙ */
    .search-box {
      width: 100%;
      position: relative;
      margin-bottom: 8px;
    }

    .search-input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      font-size: var(--fs-base);
      font-family: var(--font-main);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      background: #ffffff;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ==========================================================================
       КАРТОЧКА СКРИПТА
       ========================================================================== */
    .script-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      padding: var(--space-card);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .script-card:hover {
      box-shadow: var(--shadow-lg);
    }

    /* ВЕРХНЯЯ ЧАСТЬ КАРТОЧКИ: НАЗВАНИЕ И КНОПКА */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .card-title-group {
      flex: 1;
    }

    .card-lesson-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .script-title {
      font-size: var(--fs-title);
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }

    /* БОЛЬШАЯ КНОПКА КОПИРОВАТЬ */
    .copy-button {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-family: var(--font-main);
      font-size: var(--fs-btn);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px var(--primary-glow);
      transition: all 0.2s ease;
      flex-shrink: 0;
      user-select: none;
      outline: none;
    }

    .copy-button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(131, 58, 224, 0.35);
    }

    .copy-button:active {
      transform: translateY(0);
    }

    /* СОСТОЯНИЕ КНОПКИ ПРИ УСПЕШНОМ КОПИРОВАНИИ */
    .copy-button.copied {
      background: var(--success) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4) !important;
      transform: scale(1.03);
    }

    /* СТРОКА "КУДА ВСТАВИТЬ" */
    .where-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fbfbfd;
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
      font-size: var(--fs-base);
      color: var(--text);
    }

    .where-box strong {
      color: var(--primary);
      font-weight: 700;
      white-space: nowrap;
    }

    .where-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #dcdde5;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 600;
      color: #333333;
    }

    .lua-icon {
      width: 18px;
      height: 18px;
      background: #000080;
      color: #fff;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
    }

    /* БЛОК С КОДОМ */
    .code-container {
      position: relative;
      background: var(--code-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2d2f3f;
    }

    .code-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #181825;
      border-bottom: 1px solid #2d2f3f;
      font-size: 13px;
      color: #a6adc8;
      font-family: var(--font-code);
    }

    .code-dots {
      display: flex;
      gap: 6px;
    }

    .code-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .code-dot.red { background: #f38ba8; }
    .code-dot.yellow { background: #f9e2af; }
    .code-dot.green { background: #a6e3a1; }

    .code-block {
      margin: 0;
      padding: 20px;
      overflow-x: auto;
      font-family: var(--font-code);
      font-size: var(--fs-code);
      line-height: 1.6;
      color: var(--code-text);
      tab-size: 2;
      white-space: pre;
    }

    /* СТИЛИ ДЛЯ ПОДСВЕТКИ LUA В БЛОКЕ */
    .lua-comment { color: #6c7086; font-style: italic; }
    .lua-keyword { color: #cba6f7; font-weight: 600; }
    .lua-builtin { color: #89b4fa; font-weight: 500; }
    .lua-string { color: #a6e3a1; }
    .lua-number { color: #fab387; }
    .lua-prop { color: #f9e2af; }

    /* СНИЗУ: БЛОК "ЧТО МОЖНО МЕНЯТЬ" */
    .params-container {
      background: #faf6fe;
      border: 1px dashed #cfb2f6;
      border-radius: 10px;
      padding: 16px;
    }

    .params-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
      font-size: var(--fs-base);
    }

    .params-title span {
      font-size: 18px;
    }

    .params-list {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .param-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: var(--fs-base);
      color: #333333;
    }

    .param-bullet {
      color: var(--primary);
      font-weight: bold;
      font-size: 18px;
      line-height: 1.2;
    }

    .param-code-tag {
      background: #eedefc;
      color: #5b1baf;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-code);
      font-size: 0.9em;
      font-weight: 600;
    }

    /* ПУСТОЙ РЕЗУЛЬТАТ / ПУСТОЙ ПОИСК */
    .no-results {
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border-radius: var(--radius);
      border: 2px dashed var(--border);
    }
    .no-results-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .no-results-text {
      font-size: var(--fs-title);
      font-weight: 700;
      color: var(--text-muted);
    }

    /* КАРТОЧКА ДЛЯ УРОКА БЕЗ СКРИПТОВ (УРОК 1) */
    .lesson-empty-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      padding: 40px 24px;
      text-align: center;
    }

    .lesson-next-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-family: var(--font-main);
      font-size: var(--fs-btn);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px var(--primary-glow);
      transition: all 0.2s ease;
      user-select: none;
      margin-top: 20px;
    }

    .lesson-next-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(131, 58, 224, 0.35);
    }

    /* ПОДВАЛ */
    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: auto;
    }

    footer p strong {
      color: var(--primary);
    }

    /* ВСПЛЫВАЮЩАЯ ПОДСКАЗКА (TOAST) */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e1e2e;
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: var(--fs-base);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      border-left: 4px solid var(--success);
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* КНОПКА "НАВЕРХ" */
    #scrollToTopBtn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: #ffffff;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 10px 18px;
      border-radius: 50px;
      font-family: var(--font-main);
      font-weight: 700;
      font-size: var(--fs-base);
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.25s ease;
      z-index: 99;
      outline: none;
    }

    #scrollToTopBtn.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #scrollToTopBtn:hover {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    /* ==========================================================================
       АДАПТИВНОСТЬ: НА ТЕЛЕФОНЕ И ПЛАНШЕТЕ
       ========================================================================== */
    @media (max-width: 860px) {
      .main-container {
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 16px;
      }

      .sidebar {
        position: static;
        padding: 12px;
      }

      .lessons-nav {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 6px;
        -webkit-overflow-scrolling: touch;
      }

      .lesson-btn {
        white-space: nowrap;
        width: auto;
        padding: 10px 14px;
        gap: 8px;
      }

      .header-container {
        padding: 12px 16px;
      }

      .card-top {
        flex-direction: column;
        align-items: stretch;
      }

      .copy-button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- ШАПКА САЙТА -->
  <header>
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">R</div>
        <div class="brand-text">
          <h1>Roblox Studio: скрипты курса</h1>
          <span class="subtitle">Быстрые шпаргалки для юных разработчиков 🚀</span>
        </div>
      </div>

      <!-- КНОПКА: РЕЖИМ ПРОЕКТОРА ДЛЯ БОЛЬШОГО ЭКРАНА / КЛАССА -->
      <button id="projectorToggle" class="projector-toggle-btn" title="Увеличить текст в 1.5 раза для экрана проектора">
        <span class="toggle-icon">🔍</span>
        <span class="toggle-text">Режим проектора: Выкл</span>
      </button>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <div class="main-container">
    
    <!-- ЛЕВАЯ КОЛОНКА: СПИСОК УРОКОВ -->
    <aside class="sidebar">
      <div class="sidebar-title">
        <span>Уроки курса</span>
        <span id="totalLessonsBadge"></span>
      </div>
      <nav class="lessons-nav" id="lessonsNav">
        <!-- Кнопки уроков генерируются динамически из массива скриптов -->
      </nav>
    </aside>

    <!-- ПРАВАЯ КОЛОНКА: ПОИСК И КАРТОЧКИ СКРИПТОВ -->
    <main class="content-area">
      <!-- Поиск по скриптам -->
      <div class="search-box">
        <span class="search-icon">🔎</span>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Поиск механики (например: лава, мост, цвет, прыжок)..."
          autocomplete="off"
        >
      </div>

      <div class="content-header">
        <h2 id="currentLessonHeader" class="current-lesson-title">Все скрипты</h2>
        <span id="scriptsCountBadge" class="scripts-counter">0 скриптов</span>
      </div>

      <!-- Контейнер для карточек скриптов -->
      <div id="cardsList" style="display: flex; flex-direction: column; gap: 24px;"></div>
    </main>

  </div>

  <!-- ПОДВАЛ -->
  <footer>

    /* ==========================================================================
       ПОДСВЕТКА LUA СИНТАКСИСА (БЕЗ ВНЕШНИХ БИБЛИОТЕК)
       ========================================================================== */
    function highlightLua(rawCode) {
      // Экранируем HTML символы
      const escapeHtml = (str) => {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      };

      const lines = rawCode.split('\n');
      const highlightedLines = lines.map(line => {
        // Проверка на строку с комментарием Lua
        const commentIndex = line.indexOf('--');
        if (commentIndex !== -1) {
          const beforeComment = line.substring(0, commentIndex);
          const commentPart = line.substring(commentIndex);
          return highlightLuaSegment(beforeComment) + `<span class="lua-comment">${escapeHtml(commentPart)}</span>`;
        }
        return highlightLuaSegment(line);
      });

      return highlightedLines.join('\n');
    }

    function highlightLuaSegment(codeSegment) {
      let escaped = codeSegment
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Подсветка строк в кавычках ("...")
      escaped = escaped.replace(/(".*?")/g, '<span class="lua-string">$1</span>');

      // Ключевые слова Lua
      const keywords = ['local', 'function', 'end', 'if', 'then', 'else', 'elseif', 'while', 'do', 'return', 'not', 'and', 'or', 'true', 'false', 'nil', 'for', 'in'];
      keywords.forEach(kw => {
        const regex = new RegExp(`\\b(${kw})\\b`, 'g');
        escaped = escaped.replace(regex, '<span class="lua-keyword">$1</span>');
      });

      // Встроенные объекты и функции Roblox
      const builtins = ['script', 'Parent', 'workspace', 'game', 'task', 'wait', 'delay', 'BrickColor', 'Color3', 'Vector3', 'FindFirstChild', 'FindFirstAncestorWhichIsA', 'Connect', 'Touched', 'TouchEnded', 'GetService', 'GetPlayerFromCharacter', 'PlayerAdded', 'TweenInfo', 'Enum', 'Instance', 'Destroy', 'new', 'fromRGB', 'GetAttribute', 'SetAttribute', 'math', 'pairs'];
      builtins.forEach(bi => {
        const regex = new RegExp(`\\b(${bi})\\b`, 'g');
        escaped = escaped.replace(regex, '<span class="lua-builtin">$1</span>');
      });

      // Свойства и типы
      const props = ['Color', 'CanCollide', 'Transparency', 'CanTouch', 'Health', 'JumpPower', 'Jump', 'CFrame', 'Position', 'Humanoid', 'HumanoidRootPart', 'RespawnLocation', 'PlayerGui', 'ScreenGui', 'TextLabel', 'Visible', 'Text', 'AssemblyLinearVelocity', 'Velocity', 'MaxForce', 'Players', 'TweenService', 'RunService', 'EasingStyle', 'Linear', 'EasingDirection', 'InOut', 'BodyVelocity', 'Play', 'Create', 'UseJumpPower'];
      props.forEach(pr => {
        const regex = new RegExp(`\\b(${pr})\\b`, 'g');
        escaped = escaped.replace(regex, '<span class="lua-prop">$1</span>');
      });

      // Цифры
      escaped = escaped.replace(/\b(\d+(\.\d+)?)\b/g, '<span class="lua-number">$1</span>');

      return escaped;
    }

    /* ==========================================================================
       УНИВЕРСАЛЬНОЕ КОПИРОВАНИЕ В БУФЕР ОБМЕНА
       (navigator.clipboard + надежный fallback через textarea)
       ========================================================================== */
    async function copyToClipboard(text, buttonElement) {
      let copied = false;

      // 1. Попытка через современный Clipboard API
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch (err) {
          copied = false;
        }
      }

      // 2. Резервный способ (fallback) для старых браузеров или не-HTTPS
      if (!copied) {
        try {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.left = '-99999px';
          textArea.style.top = '-99999px';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          copied = document.execCommand('copy');
          document.body.removeChild(textArea);
        } catch (err) {
          copied = false;
        }
      }

      // 3. Визуальный отклик кнопки: зеленеет на 2 секунды с текстом "Скопировано!"
      if (buttonElement) {
        const originalHtml = buttonElement.innerHTML;
        buttonElement.classList.add('copied');
        buttonElement.innerHTML = '<span>✓</span> Скопировано!';

        setTimeout(() => {
          buttonElement.classList.remove('copied');
          buttonElement.innerHTML = originalHtml;
        }, 2000);
      }

      // Всплывающий тост
      showToast();
    }

    /* Всплывающий тост */
    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

          searchQuery = '';

        renderCards();

        btn.onclick = () => selectLesson(lessonItem.id);
        navContainer.appendChild(btn);

    /* ==========================================================================

    function renderCards() {

        headerTitle.textContent = `Все скрипты курса`;

      // Фильтрация по уроку

      if (currentSelectedLesson !== 'all') {
        filtered = filtered.filter(s => s.lesson === currentSelectedLesson);
      }

      // Специальная карточка для Урока 1 (где строим руками, а скриптов нет)

        counterBadge.textContent = '0 скриптов';
        container.innerHTML = `
          <div class="lesson-empty-card">
            <div style="font-size: 52px; margin-bottom: 14px;">🧱 🛠️ 🎨</div>
            <h3 style="font-size: var(--fs-title); font-weight: 800; margin-bottom: 12px; color: var(--text);">Урок 1. Знакомство со Studio</h3>
            <p style="font-size: var(--fs-base); color: var(--text-muted); line-height: 1.6; max-width: 620px; margin: 0 auto;">
              В этом уроке <strong>скриптов нет</strong>: строим руками, изучаем базовые инструменты (<span class="param-code-tag">Select</span>, <span class="param-code-tag">Move</span>, <span class="param-code-tag">Scale</span>, <span class="param-code-tag">Rotate</span>), свойства деталей (<span class="param-code-tag">Color</span>, <span class="param-code-tag">Material</span>, <span class="param-code-tag">Anchored</span>) и окно <span class="param-code-tag">Explorer</span>.
            </p>
            <div>
              <button class="lesson-next-btn" onclick="selectLesson(2)">
                Перейти к Уроку 2 (Первый скрипт) ➡️
              </button>
            </div>
          </div>
        `;
        return;
      }

      // Фильтрация по поисковому запросу
      if (searchQuery.trim() !== '') {
        const query = searchQuery.toLowerCase().trim();
        filtered = filtered.filter(s => 
          s.title.toLowerCase().includes(query) ||
          s.where.toLowerCase().includes(query) ||
          s.code.toLowerCase().includes(query) ||
          s.params.some(p => p.toLowerCase().includes(query))
        );
        headerTitle.textContent = `Результаты поиска: "${searchQuery}"`;
      }

      counterBadge.textContent = `${filtered.length} ${pluralizeScripts(filtered.length)}`;

      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <div class="no-results-icon">🔎</div>
            <div class="no-results-text">Скриптов не найдено</div>
            <p style="color: var(--text-muted); margin-top: 8px;">Попробуйте выбрать другой урок или очистить поиск.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((scriptItem, index) => {
        const card = document.createElement('article');
        card.className = 'script-card';

        // Генерация параметров "Что можно менять"
        const paramsHtml = scriptItem.params.map(param => {
          return `
            <li class="param-item">
              <span class="param-bullet">•</span>
              <span>${formatParamText(param)}</span>
            </li>
          `;
        }).join('');

        // Подсветка кода
        const highlightedHtml = highlightLua(scriptItem.code);

        // Бейдж урока
        const isBonus = scriptItem.lesson === 'Бонус';
        const tagText = isBonus ? '⭐ Бонус' : `Урок ${scriptItem.lesson}`;
        const tagStyle = isBonus ? 'style="background: #fef3c7; color: #b45309;"' : '';

        card.innerHTML = `
          <!-- Верхняя часть: Название и Кнопка Копирования -->
          <div class="card-top">
            <div class="card-title-group">
              <span class="card-lesson-tag" ${tagStyle}>${tagText}</span>
              <h3 class="script-title">${escapeHtml(scriptItem.title)}</h3>
            </div>
            <button class="copy-button" data-index="${index}">
              📋 Копировать
            </button>
          </div>

          <!-- Строка "Куда вставить" -->
          <div class="where-box">
            <strong>Куда вставить:</strong>
            <span class="where-badge">
              <span class="lua-icon">📜</span>
              ${escapeHtml(scriptItem.where)}
            </span>
          </div>

          <!-- Блок с моноширинным кодом -->
          <div class="code-container">
            <div class="code-header-bar">
              <div class="code-dots">
                <div class="code-dot red"></div>
                <div class="code-dot yellow"></div>
                <div class="code-dot green"></div>
              </div>
              <span>Roblox Lua Script</span>
            </div>
            <pre class="code-block"><code>${highlightedHtml}</code></pre>
          </div>

          <!-- Блок "Что можно менять" -->
          <div class="params-container">
            <div class="params-title">
              <span>⚙️</span>
              <span>Что можно менять в коде:</span>
            </div>
            <ul class="params-list">
              ${paramsHtml}
            </ul>
          </div>
        `;

        // Обработчик клика по кнопке копирования
        const copyBtn = card.querySelector('.copy-button');
        copyBtn.addEventListener('click', () => {
          copyToClipboard(scriptItem.code, copyBtn);
        });

        container.appendChild(card);
      });
    }

    // Подсветка кавычек и кода внутри пояснений к параметрам
    function formatParamText(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(/(".*?"|[a-zA-Z0-9_\.]+\(.*?\)|[a-zA-Z0-9_]+\.[a-zA-Z0-9_]+)/g, '<span class="param-code-tag">$1</span>');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function pluralizeScripts(n) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod100 >= 11 && mod100 <= 19) return 'скриптов';
      if (mod10 === 1) return 'скрипт';
      if (mod10 >= 2 && mod10 <= 4) return 'скрипта';
      return 'скриптов';
    }

    /* ==========================================================================
       РЕЖИМ ПРОЕКТОРА
       Увеличивает весь текст в 1.5 раза для показа с проектора на задние парты
       ========================================================================== */
    const projectorBtn = document.getElementById('projectorToggle');
    let isProjectorMode = false;

    // Восстановление настройки из localStorage при наличии
    try {
      if (localStorage.getItem('roblox_projector_mode') === 'true') {
        enableProjectorMode(true);
      }
    } catch(e) {}

    projectorBtn.addEventListener('click', () => {
      enableProjectorMode(!isProjectorMode);
    });

    function enableProjectorMode(enable) {
      isProjectorMode = enable;
      const htmlEl = document.documentElement;
      const toggleText = projectorBtn.querySelector('.toggle-text');

      if (isProjectorMode) {
        htmlEl.classList.add('projector-mode');
        projectorBtn.classList.add('active');
        toggleText.textContent = 'Режим проектора: Вкл ✨';
      } else {
        htmlEl.classList.remove('projector-mode');
        projectorBtn.classList.remove('active');
        toggleText.textContent = 'Режим проектора: Выкл';
      }

      try {
        localStorage.setItem('roblox_projector_mode', isProjectorMode ? 'true' : 'false');
      } catch(e) {}
    }

    /* ==========================================================================
       ПОИСК
       ========================================================================== */
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    /* ==========================================================================
       КНОПКА "НАВЕРХ"
       ========================================================================== */
    const scrollToTopBtn = document.getElementById('scrollToTopBtn');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        scrollToTopBtn.classList.add('visible');
      } else {
        scrollToTopBtn.classList.remove('visible');
      }
    });

    scrollToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    /* ==========================================================================
       ИНИЦИАЛИЗАЦИЯ
       ========================================================================== */
    renderLessonsNav();
    renderCards();
  </script>
</body>
</html>
